[package]
name = "filewheel"
version = "0.1.0"
description = "FileWheel — drop a file on the wheel, get it converted. Local, private file converter."
authors = ["FileWheel contributors"]
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the bin name
# on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "filewheel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
