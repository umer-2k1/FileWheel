<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <title>FileWheel</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span class="name">FileWheel</span>
        </div>
      </header>

      <nav class="modes" id="modes" aria-label="Wheel mode">
        <button data-mode="convert" aria-selected="true">Convert</button>
        <button data-mode="tools" aria-selected="false">Tools</button>
        <button data-mode="actions" aria-selected="false">Actions</button>
      </nav>

      <div class="filebar hidden" id="filebar">
        <span class="file-chip" id="file-chip"></span>
        <span class="hint">Shift convert · Ctrl tools · Alt actions</span>
      </div>

      <div class="wheel-wrap" id="wheel"></div>

      <div class="toast hidden" id="toast"></div>
    </div>
  </body>
</html>
